name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 168.119.160.128 >> ~/.ssh/known_hosts

      - name: Sync source to box
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude .git --exclude .github \
            --exclude .DS_Store --exclude Dockerfile \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            ./ deploy@168.119.160.128:/opt/stack/apps/sheets/

      - name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes deploy@168.119.160.128 \
            "cd /opt/stack && docker compose up -d --build sheets"
